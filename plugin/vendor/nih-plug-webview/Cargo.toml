[package]
name = "nih_plug_webview"
version = "0.0.0"
edition = "2021"
authors = ["Max Huttunen <max.huttunen@gmail.com>"]
license = "ISC"
description = "An adapter to use webview GUIs with NIH-plug (pinned for SkyForge)"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
parking_lot = "0.12.1"
serde_json = "1.0"
wry = { version = "0.35.1" }
baseview = { git = "https://github.com/RustAudio/baseview", rev = "579130ecb4f9f315ae52190af42f0ea46aeaa4a2" }
raw-window-handle = "0.5"
crossbeam = "0.8.2"
keyboard-types = "0.6.2"
