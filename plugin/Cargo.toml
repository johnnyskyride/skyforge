[package]
name = "skyforge_vst"
version = "2.2.0"
edition = "2021"
authors = ["johnnyskyride"]
description = "SkyForge analog instrument — VST3 / CLAP"
license = "MIT"

[lib]
name = "skyforge_vst"
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_webview = { path = "vendor/nih-plug-webview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
