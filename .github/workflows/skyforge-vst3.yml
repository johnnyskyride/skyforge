name: SkyForge VST3

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.1-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev libx11-xcb-dev libxcb1-dev libgl1-mesa-dev libxcursor-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libxcb-xfixes0-dev
      - name: Build plugin
        working-directory: plugin
        run: cargo build --release --locked
      - name: Bundle VST3
        working-directory: plugin
        run: python bundle.py
      - name: Zip bundle
        shell: bash
        working-directory: plugin/dist
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip SkyForge-windows.vst3.zip SkyForge.vst3
          elif [ "$RUNNER_OS" = "macOS" ]; then
            zip -r SkyForge-mac.vst3.zip SkyForge.vst3
          else
            zip -r SkyForge-linux.vst3.zip SkyForge.vst3
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('vst3-{0}', github.run_number) }}
          name: SkyForge VST3 ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            SkyForge for Ableton Live — native instrument (VST3).

            **This is the real SkyForge face in Live** — same chassis as the HTML file and the desktop app, **Forge and Rack skins**, Trim lining, Kind, Call, keys, Halloween / Waters / Aether.

            Sound is native (bounce and freeze work).

            **Ear Wyrm works in Live now.** Press **Ear Wyrm**, play, press **Stop**, wait for **Cut…**. The take is the native instrument, then the clip is cut on the face. Play at least a beat — a tap with no notes will not cut a wyrm.

            **Bounce** writes a WAV of the native take into **Downloads**. **MIDI** dumps the notes there too. Ear Wyrm video and WAV/MP3 land in Downloads from the face.

            Put SkyForge on a **MIDI track**. Arm the track. Play.

            **Windows:** unzip `SkyForge-windows.vst3.zip` into
            `C:\Program Files\Common Files\VST3\`
            then Live → Settings → Plug-Ins → enable VST3 system folders → **Rescan**.

            **Mac:** unzip into `~/Library/Audio/Plug-Ins/VST3/` then rescan.

            Replace any older SkyForge VST (vst3-5 and earlier) with this one, then rescan.

            Hide or fold the window — knobs, Kind, Rack, trim, and the take stay. Open it again and the face comes back as you left it.

            Kind = Free uses the knobs. Earth / Water / Fire / Wind load that dragon character (Volume / Halloween / Aether still layer on top).

            Switch **Forge / Rack** on the face the same way as the app.

            The HTML file and the desktop app stay as they are. This is the Live twin.
          files: plugin/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
