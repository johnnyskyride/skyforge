name: SkyForge VST3

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.1-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev libx11-xcb-dev libxcb1-dev libgl1-mesa-dev libxcursor-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libxcb-xfixes0-dev
      - name: Fetch Rust crates
        working-directory: plugin
        run: cargo fetch --locked
      - name: Stamp VST3 MIDI so Live records it
        working-directory: plugin
        run: python patch-nih-midi.py
      - name: Build plugin
        working-directory: plugin
        run: cargo build --release --locked --offline
      - name: Bundle VST3
        working-directory: plugin
        run: python bundle.py
      - name: Zip bundle
        shell: bash
        working-directory: plugin/dist
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip SkyForge-windows.vst3.zip SkyForge.vst3
          elif [ "$RUNNER_OS" = "macOS" ]; then
            zip -r SkyForge-mac.vst3.zip SkyForge.vst3
          else
            zip -r SkyForge-linux.vst3.zip SkyForge.vst3
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('vst3-{0}', github.run_number) }}
          name: SkyForge VST3 ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            SkyForge for Ableton Live — native instrument (VST3).

            **This is the real SkyForge face in Live** — same chassis as the HTML file and the desktop app, **Forge and Rack skins**, Trim lining, Kind, Call, keys, Halloween / Waters / Aether.

            **Waters / Halloween / Aether** are a new analog chain. Waters is a four-voice tidal chorus with a small room, not a muddy two-tap. Halloween is a dark stereo plate with tape wow (no cheap fifth). Aether is analog haze — dithered tape, not an 8-bit crush. Kind = Water / Fire / Wind sit on those tunings.

            The plugin window is the chassis. No extra pad, no rounded outer frame — Live's own title strip is the only chrome Ableton draws. The window hugs the piano on Forge and Rack. Trim is a tube in the bezel (Purple / Green / Plasma), not a glow behind the panel.

            Ear Wyrm shows **Processing** on the bottom-right plate while it cuts. When the take is ready it lands at the top without shoving the keys off the window.

            **Options** (header, next to the preset list):
            - Save / load your own presets (JSON). Saved takes also land in Downloads.
            - Size the face: 75% / 100% / 125% / 150% / 200%.
            - Check for updates (latest Live build on GitHub).

            **Ear Wyrm works in Live now.** Press **Ear Wyrm**, play, press **Stop**, wait for **Cut…**. The take is the native instrument, then the clip is cut on the face. Play at least a beat — a tap with no notes will not cut a wyrm.

            **Bounce** writes a WAV of the native take into **Downloads** (or Documents/SkyForge if Downloads is locked). Bounce is not capped at 30 seconds — up to ten minutes. **MIDI** dumps the notes there too. Ear Wyrm video is **MP4** when the face can encode it; WAV/MP3 land in Downloads from the face.

            Put SkyForge on a **MIDI track**. Delete any older SkyForge from the rack first, then drag this build in (Live caches the old MIDI layout). Arm the track. Play.

            **Computer keyboard:** click the SkyForge window, then play Z/X/C/V (same layout as Live). The synth should sound. To write those notes into a clip, arm the track, hit Record, play. If the clip is still empty, set that track's MIDI From to **SkyForge** (the plugin), Monitor In, and record again.
            - **MIDI controller:** Live → Settings → MIDI → your device → **Track** on. Arm, Record, play.
            - Clicking SkyForge's on-screen piano is preview; computer keys are the playable keyboard.

            To print audio instead of MIDI: new audio track → Audio From: the SkyForge track → arm and record, or Freeze/Flatten.

            **Windows:** unzip `SkyForge-windows.vst3.zip` into
            `C:\Program Files\Common Files\VST3\`
            then Live → Settings → Plug-Ins → enable VST3 system folders → **Rescan**.

            **Mac:** unzip into `~/Library/Audio/Plug-Ins/VST3/` then rescan.

            Hide or fold the window — knobs, Kind, Rack, trim, handle, size, your presets, and the last three Ear Wyrms stay. Open it again and the face comes back as you left it. The Wyrms strip keeps three takes; a new cut does not wipe the last two.

            Replace any older SkyForge VST (vst3-25 and earlier) with this one, then rescan. Remove the old device from the track and add the new one.

            Kind = Free uses the knobs. Earth / Water / Fire / Wind load that dragon character (Volume / Halloween / Aether still layer on top).

            Switch **Forge / Rack** on the face the same way as the app.

            The HTML file and the desktop app stay as they are. This is the Live twin.

          files: plugin/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
