[package]
name = "skyforge"
version = "1.0.0"
description = "SkyForge analog instrument"
authors = ["johnnyskyride"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "2.12", features = ["tls"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
